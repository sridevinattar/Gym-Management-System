<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - FitZone</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="text-center mb-4">

            <div class="auth-logo">
                <i class="bi bi-lightning-charge-fill"></i>
            </div>

            <h2>Forgot Password?</h2>

            <p class="text-muted">
                Enter your email address to reset your password.
            </p>

        </div>


        <form id="forgotPasswordForm">

            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    id="resetEmail"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <button type="submit" class="btn btn-primary w-100">

                <i class="bi bi-envelope me-2"></i>

                Send Reset Link

            </button>

        </form>


        <div id="resetMessage"
             class="alert mt-3 d-none">
        </div>


        <div class="text-center mt-4">

            <a href="login.html" class="auth-link">

                <i class="bi bi-arrow-left me-1"></i>

                Back to Login

            </a>

        </div>

    </div>

</div>


<script>

document.getElementById("forgotPasswordForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const email =
        document.getElementById("resetEmail").value.trim();

    const savedEmail =
        localStorage.getItem("fitzoneAdminEmail") ||
        "admin@fitzone.com";

    const message =
        document.getElementById("resetMessage");


    if (email.toLowerCase() === savedEmail.toLowerCase()) {

        message.className = "alert alert-success mt-3";

        message.innerHTML =
            "<i class='bi bi-check-circle me-2'></i>" +
            "Password reset instructions have been sent successfully.";

    } else {

        message.className = "alert alert-danger mt-3";

        message.innerHTML =
            "<i class='bi bi-exclamation-circle me-2'></i>" +
            "No account found with this email address.";

    }

});

</script>

</body>

</html>
